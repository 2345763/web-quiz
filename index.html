<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Neural Automation Website Brief</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Plan your website with Neural Automation: 15 quick questions, sent to us on WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one 580px column. Slim brand header, a circuit-trace progress line (15 nodes, like the logo's traces),
   one question per screen, and a sticky action bar pinned to the bottom of the phone. */
:root{
  --ink:#031018;        /* logo background */
  --panel:#081b28;
  --panel-hi:#0d2536;
  --line:#173346;
  --line-hi:#2a5270;
  --fg:#eaf3fa;
  --muted:#8aa3b6;
  --faint:#5b7689;
  --signal:#4699e7;     /* logo electric blue */
  --signal-hi:#9acef5;  /* logo highlight node */
  --signal-wash:rgba(70,153,231,.10);
  --signal-glow:rgba(70,153,231,.45);
  --wa:#25d366;
  --wa-ink:#03200f;
  --err:#ff9a8a;
  --display:"Unbounded","Onest",system-ui,sans-serif;
  --body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:14px;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;background:var(--ink)}
*,*::before,*::after{box-sizing:inherit}
body{
  min-height:100%;margin:0;color:var(--fg);font:400 16px/1.55 var(--body);
  background:radial-gradient(70% 45% at 92% -8%,rgba(70,153,231,.16),transparent 70%),var(--ink);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
}
.app{min-height:100%;display:flex;flex-direction:column}
.wrap{width:100%;max-width:580px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--signal-hi);outline-offset:3px;border-radius:6px}

/* Header */
.top{padding-block:18px 10px}
.top .head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:34px;height:auto;display:block}
.brand span{font:600 12px/1.1 var(--display);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.brand small{display:block;font:500 9px/1.4 var(--mono);letter-spacing:.32em;color:var(--signal-hi);margin-top:3px}
.tag{font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.app[data-screen="intro"] .top{display:none}

/* Circuit trace progress */
.trace{list-style:none;margin:14px 0 0;padding:0;display:grid;grid-template-columns:repeat(15,1fr);height:14px}
.trace li{position:relative}
.trace li::before{content:"";position:absolute;left:0;right:0;top:6px;height:2px;background:var(--line);transition:background .3s}
.trace li::after{content:"";position:absolute;right:0;top:3px;width:8px;height:8px;border-radius:50%;
  background:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line-hi);transition:all .3s}
.trace li.done::before{background:var(--signal)}
.trace li.done::after{background:var(--signal);box-shadow:0 0 0 1.5px var(--signal)}
.trace li.now::before{background:linear-gradient(90deg,var(--signal),var(--signal-hi))}
.trace li.now::after{background:var(--signal-hi);box-shadow:0 0 0 3px var(--ink),0 0 0 4.5px var(--signal-hi),0 0 14px var(--signal-glow)}
.app[data-screen="intro"] .trace{display:none}

/* Stage */
main{flex:1;padding-block:28px 32px}
.screen{animation:rise .32s cubic-bezier(.2,.7,.2,1)}
@keyframes rise{from{opacity:.35;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{margin:0 0 12px;font:500 12px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.eyebrow b{font:600 15px/1 var(--display);color:var(--signal-hi);letter-spacing:.02em}
.eyebrow .sep{color:var(--faint)}
h1,h2{text-wrap:balance;margin:0}
h2.q{font:600 clamp(1.4rem,1.05rem + 1.7vw,1.9rem)/1.22 var(--body);letter-spacing:-.015em}
h2.q:focus{outline:none}
.help{margin:10px 0 0;color:var(--muted);max-width:60ch}
.field{margin-top:24px;display:grid;gap:14px}
.opt-tag{font:500 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);border:1px solid var(--line);border-radius:99px;padding:4px 7px;vertical-align:middle;margin-left:6px}

/* Inputs */
.input{width:100%;background:var(--panel);border:1.5px solid var(--line);border-radius:var(--r);padding:16px 16px;font-size:17px;color:var(--fg);transition:border-color .2s,box-shadow .2s;resize:vertical}
.input::placeholder{color:var(--faint)}
.input:focus{outline:none;border-color:var(--signal);box-shadow:0 0 0 4px var(--signal-wash)}
textarea.input{min-height:120px;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line-hi);background:transparent;border-radius:99px;padding:8px 13px;font-size:14px;color:var(--muted);transition:all .18s}
.chip:hover{color:var(--fg);border-color:var(--signal)}
.chip[aria-pressed="true"]{background:var(--signal-wash);border-color:var(--signal);color:var(--fg)}
.err{min-height:1.2em;margin:0;color:var(--err);font-size:14px}

/* Options */
.opts{display:grid;gap:10px}
.opts.grid{grid-template-columns:repeat(auto-fit,minmax(148px,1fr))}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;background:var(--panel);border:1.5px solid var(--line);border-radius:var(--r);padding:15px 16px;transition:border-color .18s,background .18s,transform .12s}
.opt:hover{border-color:var(--line-hi);background:var(--panel-hi)}
.opt:active{transform:scale(.99)}
.opt[aria-checked="true"],.opt[aria-pressed="true"]{border-color:var(--signal);background:linear-gradient(180deg,rgba(70,153,231,.14),rgba(70,153,231,.05)),var(--panel)}
.node{flex:none;width:20px;height:20px;margin-top:2px;border-radius:50%;border:1.5px solid var(--line-hi);display:grid;place-items:center;transition:all .18s}
.node::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--signal-hi);transform:scale(0);transition:transform .18s}
.opt[aria-checked="true"] .node{border-color:var(--signal-hi);box-shadow:0 0 12px var(--signal-glow)}
.opt[aria-checked="true"] .node::after{transform:scale(1)}
.multi .node{border-radius:6px}
.multi .node::after{width:10px;height:6px;border-radius:0;background:none;border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(-45deg) scale(0);margin-top:-2px}
.multi .opt[aria-pressed="true"] .node{background:var(--signal-hi);border-color:var(--signal-hi)}
.multi .opt[aria-pressed="true"] .node::after{transform:rotate(-45deg) scale(1)}
.ot{display:grid;gap:3px;min-width:0}
.ol{font-weight:600;font-size:16px;line-height:1.3}
.od{color:var(--muted);font-size:14px;line-height:1.45}
.price .ol{font:500 19px/1.2 var(--mono);letter-spacing:-.01em}
.tier{font:500 10.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--signal-hi)}
.opts.grid .opt{flex-direction:column;gap:12px;padding:16px}
.opts.grid .node{position:absolute;top:14px;right:14px;margin:0}
.opts.grid .opt{position:relative}
.ico{width:40px;height:40px;color:var(--signal-hi);display:block}
.opts.multi:not(.grid){grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.multi .opt{align-items:center;padding:13px 14px}
.multi .node{margin-top:0}
.follow{margin-top:4px}

/* Bottom bar */
.bar{position:sticky;bottom:0;z-index:5;background:linear-gradient(180deg,rgba(3,16,24,0),var(--ink) 30%);padding-block:22px calc(14px + env(safe-area-inset-bottom,0px))}
.bar .wrap{display:flex;align-items:center;gap:12px}
.app[data-screen="intro"] .bar,.app[data-screen="review"] .bar{display:none}
.btn{border:0;border-radius:99px;padding:15px 24px;font-weight:600;font-size:16px;line-height:1;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;transition:transform .12s,background .2s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--signal);color:var(--ink);box-shadow:0 8px 28px -10px var(--signal-glow)}
.btn-primary:hover{background:var(--signal-hi)}
.btn-primary[aria-disabled="true"]{opacity:.45}
.btn-ghost{background:transparent;color:var(--muted);border:1.5px solid var(--line);padding:14px 18px}
.btn-ghost:hover{color:var(--fg);border-color:var(--line-hi)}
.bar .btn-primary{margin-left:auto;min-width:148px}
.kbd{font:400 12px/1 var(--mono);color:var(--faint);display:none}
@media (hover:hover) and (pointer:fine){.kbd{display:inline}}

/* Intro */
.intro{display:grid;gap:26px;padding-top:8px}
.lockup{width:148px;height:auto;display:block;margin-left:-6px}
.intro h1{font:600 clamp(1.9rem,1.3rem + 3vw,2.8rem)/1.08 var(--display);letter-spacing:-.02em}
.intro h1 em{font-style:normal;color:var(--signal-hi)}
.intro .lead{margin:14px 0 0;color:var(--muted);font-size:17px;max-width:46ch}
.facts{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.facts li{padding:14px 12px 14px 0;display:grid;gap:4px;min-width:0}
.facts li+li{padding-left:12px;border-left:1px solid var(--line)}
.facts b{font:600 18px/1 var(--display)}
.facts span{font-size:12.5px;color:var(--muted);line-height:1.35}
.covers{display:grid;gap:10px}
.covers h3{margin:0;font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.covers ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.covers li{font-size:13.5px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:6px 11px}
.covers li b{font:500 11px var(--mono);color:var(--signal-hi);margin-right:6px}
.intro .actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sig{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font:500 11px/1.4 var(--mono);letter-spacing:.16em;color:var(--faint);padding-top:6px}
.sig a{color:var(--muted);text-decoration:none;letter-spacing:.04em}
.sig a:hover{color:var(--signal-hi)}

/* Review */
.review h2{font:600 clamp(1.5rem,1.1rem + 2vw,2.1rem)/1.15 var(--display);letter-spacing:-.02em}
.sum{margin:24px 0 0;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:13px 14px 13px 16px;align-items:start}
.row+.row{border-top:1px solid var(--line)}
.row dt{font:500 11px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);grid-column:1}
.row dd{margin:0;grid-column:1;font-size:15.5px;overflow-wrap:anywhere}
.row dd.empty{color:var(--faint)}
.row .edit{grid-column:2;grid-row:1 / span 2;align-self:center;background:none;border:1px solid var(--line);border-radius:99px;color:var(--muted);font-size:13px;padding:7px 12px}
.row .edit:hover{color:var(--fg);border-color:var(--signal)}
.notes{margin-top:22px;display:grid;gap:10px}
.notes label{font-weight:600}
.send{margin-top:26px;padding:20px;border-radius:calc(var(--r) + 4px);background:var(--panel-hi);border:1px solid var(--line-hi);display:grid;gap:14px}
.wa{background:var(--wa);color:var(--wa-ink);font-size:17px;padding:17px 22px;width:100%}
.wa:hover{filter:brightness(1.06)}
.wa svg{width:22px;height:22px}
.send-note{margin:0;color:var(--muted);font-size:14.5px}
.send-note.ok{color:var(--fg)}
.alt{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.alt .btn-ghost{padding:10px 14px;font-size:14px}
.numsel{font:500 14px var(--mono);color:var(--fg);user-select:all;-webkit-user-select:all;white-space:nowrap}
.fallback{width:100%;min-height:180px;font:400 13px/1.5 var(--mono)}
.review-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:22px}
.linkish{background:none;border:0;color:var(--muted);font-size:14px;padding:6px 0;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-hi)}
.linkish:hover{color:var(--fg)}

@media (max-width:420px){
  .facts b{font-size:16px}
  .opts.grid{grid-template-columns:1fr 1fr}
  .opts.grid .od{font-size:13px}
  .send{padding:16px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

  function answered(q) {

  function validate(q) {
    const v = state.a[q.id];

      const t = (v || '').trim();
      if (q.req && t.length < (q.min || 1)) return q.id === 'name' ? 'Please enter your name to continue.'

    if (q.type === 'multi' && q.req && !answered(q)) return 'Pick at least one option to continue.';

    const v = state.a[q.id];

        <div>
          <h1>Let’s plan your <em>website.</em></h1>
          <p class="lead">Answer 15 quick questions about your business, budget and the website you want. At the end, you send the brief straight to our team on WhatsApp.</p>
        </div>
        <ul class="facts">
          <li><b>15</b><span>questions</span></li>
          <li><b>~3 min</b><span>to finish</span></li>
          <li><b>1 tap</b><span>to send on WhatsApp</span></li>
        </ul>
        <div class="covers"><h3>What we’ll ask</h3><ol>${groups}</ol></div>
        <div class="actions">
          ${saved ? '<button type="button" class="btn btn-primary" id="resume">Continue my brief</button><button type="button" class="btn btn-ghost" id="fresh">Start over</button>'
                  : '<button type="button" class="btn btn-primary" id="start">Start the brief</button>'}
        </div>
        <div class="sig"><span>BUILD. AUTOMATE. GROW.</span><a href="https://neuralautomation.in" target="_blank" rel="noopener">neuralautomation.in</a></div>
      </section>`;
  }

  function optionHTML(q, o) {
    const v = typeof o === 'string' ? o : o.v;
    const cur = state.a[q.id];
    const on = q.type === 'multi' ? (Array.isArray(cur) && cur.includes(v)) : cur === v;
    const role = q.type === 'multi' ? `aria-pressed="${on}"` : `role="radio" aria-checked="${on}"`;
    const icon = o.icon ? ICONS[o.icon] : '';
    const tier = o.t ? `<span class="tier">${esc(o.t)}</span>` : '';
    const desc = o.d ? `<span class="od">${esc(o.d)}</span>` : '';
    return `<button type="button" class="opt" data-v="${esc(v)}" ${role}>${icon}<span class="node" aria-hidden="true"></span><span class="ot">${tier}<span class="ol">${esc(v)}</span>${desc}</span></button>`;
  }

  function renderQuestion(i) {
    const q = Q[i];
    const optional = q.req === false ? '<span class="opt-tag">Optional</span>' : '';
    let field = '';
    if (q.type === 'text') {
      field = `<input class="input" id="f-${q.id}" type="text" maxlength="90" placeholder="${esc(q.ph)}" ${q.ac ? `autocomplete="${q.ac}"` : 'autocomplete="off"'} enterkeyhint="next" value="${esc(state.a[q.id] || '')}" aria-labelledby="qh" aria-describedby="err">`;
      if (q.chips) field += `<div class="chips" role="group" aria-label="Common business types">${q.chips.map(c => `<button type="button" class="chip" data-chip="${esc(c)}" aria-pressed="${state.a[q.id] === c}">${esc(c)}</button>`).join('')}</div>`;
    } else if (q.type === 'textarea') {
      field = `<textarea class="input" id="f-${q.id}" rows="4" maxlength="600" placeholder="${esc(q.ph)}" aria-labelledby="qh">${esc(state.a[q.id] || '')}</textarea>`;
    } else {
      const cls = ['opts', q.type === 'multi' ? 'multi' : 'single', q.grid ? 'grid' : '', q.price ? 'price' : ''].join(' ');
      const role = q.type === 'single' ? 'role="radiogroup"' : 'role="group"';
      field = `<div class="${cls}" ${role} aria-labelledby="qh">${q.options.map(o => optionHTML(q, o)).join('')}</div>`;
      if (q.follow) {
        const opt = q.options.find(o => o.v === state.a[q.id]);
        field += `<input class="input follow" id="f-${q.follow.id}" type="url" inputmode="url" maxlength="200" placeholder="${esc(q.follow.ph)}" value="${esc(state.a[q.follow.id] || '')}" aria-label="Current website link" ${opt && opt.ask ? '' : 'hidden'}>`;
      }
    }
    stage.innerHTML = `
      <section class="screen" aria-labelledby="qh">
        <p class="eyebrow"><b>${pad(i+1)}</b><span>/ ${Q.length}</span><span class="sep">·</span><span>${esc(groupOf(i))}</span></p>
        <h2 class="q" id="qh" tabindex="-1">${esc(q.label)}${optional}</h2>
        ${q.help ? `<p class="help">${esc(q.help)}</p>` : ''}
        <div class="field">${field}<p class="err" id="err" role="alert"></p></div>
      </section>`;
    paintNav();
    const input = stage.querySelector('#f-' + q.id);
    if (input) input.focus({ preventScroll:true });
    else stage.querySelector('#qh').focus({ preventScroll:true });
  }

  function renderReview() {
    const name = (state.a.name || '').trim().split(/\s+/)[0] || '';
    const rows = Q.map((q, i) => {
      const d = display(q);
      return `<div class="row"><dt>${esc(q.short)}</dt><dd class="${d ? '' : 'empty'}">${d ? esc(d) : 'Skipped'}</dd><button type="button" class="edit" data-edit="${i}" aria-label="Edit ${esc(q.short)}">Edit</button></div>`;
    }).join('');
    stage.innerHTML = `
      <section class="screen review">
        <p class="eyebrow"><b>✓</b><span>All 15 answered</span><span class="sep">·</span><span>Ready to send</span></p>
        <h2>Here’s your brief${name ? ', ' + esc(name) : ''}.</h2>
        <p class="help">Check your answers and tap Edit to change anything. Then send it to the Neural Automation team on WhatsApp.</p>
        <dl class="sum">${rows}</dl>
        <div class="notes">
          <label for="f-notes">Anything else we should know? <span class="opt-tag">Optional</span></label>
          <textarea class="input" id="f-notes" rows="3" maxlength="600" placeholder="e.g. We’re launching a new collection on 15 December">${esc(state.notes)}</textarea>
        </div>
        <div class="send">
          <a class="btn wa" id="wa" href="${esc(waHref())}" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1.3-3.9A8 8 0 1 1 8 18.8z"/><path d="M9 10.5h6M9 13.5h4" stroke-linecap="round"/></svg>
            Send brief on WhatsApp
          </a>
          <p class="send-note${state.sent ? ' ok' : ''}" id="sendNote">${state.sent
            ? 'WhatsApp should now be open with your brief typed in. Tap send there and our team will get back to you.'
            : 'Opens WhatsApp with your brief already typed in. Tap send in WhatsApp to share it with us.'}</p>
          <div class="alt">
            <button type="button" class="btn btn-ghost" id="copy">Copy brief</button>
            <span>WhatsApp not opening? Copy the brief and message <span class="numsel">${WA_DISPLAY}</span></span>
          </div>
          <div id="fallbackSlot"></div>
        </div>
        <div class="review-foot">
          <button type="button" class="linkish" id="toLast">Back to questions</button>
          <button type="button" class="linkish" id="reset">${state.resetArm ? 'Tap again to clear all answers' : 'Start a new brief'}</button>
        </div>
      </section>`;
    stage.querySelector('h2').setAttribute('tabindex','-1');
    stage.querySelector('h2').focus({ preventScroll:true });
  }

  function paintNav() {
    const i = state.step, q = Q[i];
    backBtn.textContent = state.fromReview ? 'Summary' : 'Back';
    const last = i === Q.length - 1;
    let label = state.fromReview ? 'Save' : last ? 'Review brief' : 'Continue';
    if (!state.fromReview && q.req === false && !answered(q)) label = last ? 'Skip & review' : 'Skip';
    nextBtn.textContent = label;
    nextBtn.setAttribute('aria-disabled', String(q.type === 'single' && !answered(q)));
  }

  function render() {
    app.dataset.screen = state.step < 0 ? 'intro' : state.step >= REVIEW ? 'review' : 'q';
    tag.textContent = state.step >= REVIEW ? 'Brief ready' : state.step >= 0 ? pad(state.step + 1) + ' / ' + Q.length : 'Website Brief';
    paintTrace();
    if (state.step < 0) renderIntro();
    else if (state.step >= REVIEW) renderReview();
    else renderQuestion(state.step);
    window.scrollTo(0, 0);
  }

  /* ---------- navigation ---------- */
  let advanceTimer = 0;
  function go(step) { clearTimeout(advanceTimer); state.step = step; persist(); render(); }
  function next() {
    const q = Q[state.step]; if (!q) return;
    const msg = validate(q);
    if (msg) { const e = $('#err'); e.textContent = msg; const f = stage.querySelector('#f-' + q.id); if (f) f.focus(); return; }
    if (state.fromReview || state.step === Q.length - 1) { state.fromReview = false; go(REVIEW); }
    else go(state.step + 1);
  }
  function back() {
    if (state.fromReview) { state.fromReview = false; go(REVIEW); return; }
    go(state.step - 1);
  }
  backBtn.addEventListener('click', back);
  nextBtn.addEventListener('click', next);

  stage.addEventListener('click', e => {
    const t = e.target.closest('button, a');
    if (!t) return;
    if (t.id === 'start') { state.a = {}; state.notes = ''; go(0); return; }
    if (t.id === 'resume') { state.a = saved.a || {}; state.notes = saved.notes || ''; const s = Math.min(Math.max(saved.step|0, 0), REVIEW); go(s); return; }
    if (t.id === 'fresh') { wipe(); saved = null; state.a = {}; state.notes = ''; go(0); return; }
    if (t.dataset.edit) { state.fromReview = true; go(+t.dataset.edit); return; }
    if (t.id === 'toLast') { go(Q.length - 1); return; }
    if (t.id === 'reset') {
      if (!state.resetArm) { state.resetArm = true; t.textContent = 'Tap again to clear all answers'; setTimeout(() => { state.resetArm = false; if (t.isConnected) t.textContent = 'Start a new brief'; }, 4000); return; }
      wipe(); saved = null; state = { step:-1, a:{}, notes:'', fromReview:false, sent:false, resetArm:false }; render(); return;
    }
    if (t.id === 'wa') { t.href = waHref(); state.sent = true; const n = $('#sendNote'); n.classList.add('ok'); n.textContent = 'WhatsApp should now be open with your brief typed in. Tap send there and our team will get back to you.'; return; }
    if (t.id === 'copy') { copyBrief(t); return; }

    const q = Q[state.step]; if (!q) return;
    if (t.dataset.chip) {
      state.a[q.id] = t.dataset.chip;
      const inp = stage.querySelector('#f-' + q.id); inp.value = t.dataset.chip;
      stage.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c === t)));
      $('#err').textContent = ''; persist(); paintNav(); return;
    }
    if (t.classList.contains('opt')) {
      const v = t.dataset.v;
      if (q.type === 'multi') {
        const arr = Array.isArray(state.a[q.id]) ? state.a[q.id].slice() : [];
        const k = arr.indexOf(v); k < 0 ? arr.push(v) : arr.splice(k, 1);
        state.a[q.id] = arr; t.setAttribute('aria-pressed', String(k < 0));
        $('#err').textContent = ''; persist(); paintNav(); return;
      }
      state.a[q.id] = v;
      stage.querySelectorAll('.opt').forEach(o => o.setAttribute('aria-checked', String(o === t)));
      $('#err').textContent = ''; persist(); paintNav();
      const opt = q.options.find(o => o.v === v);
      if (q.follow) {
        const f = stage.querySelector('#f-' + q.follow.id);
        f.hidden = !(opt && opt.ask);
        if (opt && opt.ask) { f.focus(); return; }
      }
      clearTimeout(advanceTimer);
      advanceTimer = setTimeout(next, 280);
    }
  });

  stage.addEventListener('input', e => {
    const el = e.target;
    if (el.id === 'f-notes') { state.notes = el.value; persist(); const wa = $('#wa'); if (wa) wa.href = waHref(); return; }
    const q = Q[state.step]; if (!q) return;
    if (el.id === 'f-' + q.id) {
      state.a[q.id] = el.value;
      stage.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.chip === el.value)));
      $('#err').textContent = '';
    } else if (q.follow && el.id === 'f-' + q.follow.id) state.a[q.follow.id] = el.value;
    persist(); paintNav();
  });

  stage.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || state.step < 0 || state.step >= REVIEW) return;
    const el = e.target;
    if (el.tagName === 'TEXTAREA' && !(e.metaKey || e.ctrlKey)) return;
    if (el.tagName === 'INPUT') { e.preventDefault(); next(); }
    else if (el.tagName === 'TEXTAREA') { e.preventDefault(); next(); }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target === document.body && state.step >= 0 && state.step < REVIEW) { e.preventDefault(); next(); }
  });

  function copyBrief(btn) {
    const text = briefText();
    const done = () => { btn.textContent = 'Copied'; setTimeout(() => { if (btn.isConnected) btn.textContent = 'Copy brief'; }, 2200); };
    const fallback = () => {
      const slot = $('#fallbackSlot');
      slot.innerHTML = '<textarea class="input fallback" id="f-fallback" readonly aria-label="Your brief"></textarea>';
      const ta = $('#f-fallback'); ta.value = text; ta.focus(); ta.select();
      btn.textContent = 'Select & copy below';
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
      else fallback();
    } catch (err) { fallback(); }
  }

  render();
})();
</script>

</body></html>
